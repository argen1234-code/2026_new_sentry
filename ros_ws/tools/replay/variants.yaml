# Sweep definitions for the bag-replay harness.
#
# `changes` are dotted paths into nav2_params.yaml after <robot_namespace> is
# replaced with "". Only the listed keys are overridden; everything else stays
# identical to the real-robot config, so a variant differs from the baseline by
# exactly what is written here.
#
# Params known to be dead and therefore never swept:
#   FollowPath.lookahead_dist          -- ignored while use_velocity_scaled_lookahead_dist
#   GridBased.w_heuristic_cost         -- not declared by Humble Theta*
#   GridBased.how_many_corners         -- lib forces 8
#   FollowPath.rotate_to_heading_*vel  -- not declared by this plugin version

groups:
  # ---- R2: fidelity baseline ----------------------------------------------
  # F0 reproduces the pre-X2 config: 1 Hz replanning, 5/2 Hz costmaps,
  # mark_threshold 0, 0.15-0.50 m obstacle heights, no observation_persistence.
  #
  # Which baseline is comparable depends on the scenario:
  #   scenario A (dyn_base_open, 10-25)  -> predates 7189a7b, use F0
  #   scenario B (dyn_1029_1712, 10-29)  -> recorded WITH X2 (/plan 2.55 Hz,
  #                                         costmaps 1.7-1.8 Hz), use G0/C0
  F0:
    label: pre-X2 config (what was recorded)
    changes:
      local_costmap.local_costmap.ros__parameters.update_frequency: 5.0
      local_costmap.local_costmap.ros__parameters.publish_frequency: 1.0
      local_costmap.local_costmap.ros__parameters.intensity_voxel_layer.mark_threshold: 0
      local_costmap.local_costmap.ros__parameters.intensity_voxel_layer.min_obstacle_height: 0.15
      local_costmap.local_costmap.ros__parameters.intensity_voxel_layer.max_obstacle_height: 0.50
      local_costmap.local_costmap.ros__parameters.intensity_voxel_layer.terrain_map.min_obstacle_height: 0.15
      local_costmap.local_costmap.ros__parameters.intensity_voxel_layer.terrain_map.max_obstacle_height: 0.50
      local_costmap.local_costmap.ros__parameters.intensity_voxel_layer.terrain_map.observation_persistence: 0.0
      global_costmap.global_costmap.ros__parameters.update_frequency: 2.0
      global_costmap.global_costmap.ros__parameters.publish_frequency: 1.0
      global_costmap.global_costmap.ros__parameters.intensity_voxel_layer.mark_threshold: 0
      global_costmap.global_costmap.ros__parameters.intensity_voxel_layer.min_obstacle_height: 0.15
      global_costmap.global_costmap.ros__parameters.intensity_voxel_layer.max_obstacle_height: 0.50
      global_costmap.global_costmap.ros__parameters.intensity_voxel_layer.terrain_map_ext.min_obstacle_height: 0.15
      global_costmap.global_costmap.ros__parameters.intensity_voxel_layer.terrain_map_ext.max_obstacle_height: 0.50
      global_costmap.global_costmap.ros__parameters.intensity_voxel_layer.terrain_map_ext.observation_persistence: 0.0
      bt_navigator.ros__parameters.default_nav_to_pose_bt_xml: "{HERE}/bt/pre_x2_navigate_to_pose.xml"

  # ---- R3: global planner -------------------------------------------------
  G0:
    label: baseline Theta*
    changes: {}
  G1:
    label: Theta* traversal cost 5 (prefers centre line)
    changes:
      planner_server.ros__parameters.GridBased.w_traversal_cost: 5.0
  G2:
    label: Theta* traversal cost 20 (prefers shortest)
    changes:
      planner_server.ros__parameters.GridBased.w_traversal_cost: 20.0
  G3:
    label: no final approach orientation
    changes:
      planner_server.ros__parameters.GridBased.use_final_approach_orientation: false
  G4:
    label: unknown space is fatal to the planner
    changes:
      planner_server.ros__parameters.GridBased.allow_unknown: false
  G5:
    label: SmacPlanner2D
    changes:
      planner_server.ros__parameters.GridBased.plugin: nav2_smac_planner/SmacPlanner2D
      planner_server.ros__parameters.GridBased.tolerance: 0.5
      planner_server.ros__parameters.GridBased.downsample_costmap: false
      planner_server.ros__parameters.GridBased.max_iterations: 1000000
  G6:
    label: NavFn A*
    changes:
      planner_server.ros__parameters.GridBased.plugin: nav2_navfn_planner/NavfnPlanner
      planner_server.ros__parameters.GridBased.tolerance: 0.5
      planner_server.ros__parameters.GridBased.use_astar: true

  # ---- R4: local controller ----------------------------------------------
  C0:
    label: baseline controller
    changes: {}
  C1:
    label: lookahead_time 0.8 (short lookahead, 0.36 m at full speed)
    changes:
      controller_server.ros__parameters.FollowPath.lookahead_time: 0.8
  C2:
    label: lookahead_time 2.2 (long lookahead, 0.99 m at full speed)
    changes:
      controller_server.ros__parameters.FollowPath.lookahead_time: 2.2
  C3:
    label: no rotate-to-heading (never stop to turn)
    changes:
      controller_server.ros__parameters.FollowPath.use_rotate_to_heading: false
  C4:
    label: rotate-to-heading threshold 0.4
    changes:
      controller_server.ros__parameters.FollowPath.use_rotate_to_heading_treshold: 0.4
  C5:
    label: softer translation gain (kp 2.0, kd 0.8)
    changes:
      controller_server.ros__parameters.FollowPath.translation_kp: 2.0
      controller_server.ros__parameters.FollowPath.translation_kd: 0.8
  C6:
    label: faster rotation gain (kp 1.6)
    changes:
      controller_server.ros__parameters.FollowPath.rotation_kp: 1.6
  C7:
    label: max linear 0.35 m/s
    changes:
      controller_server.ros__parameters.FollowPath.v_linear_max: 0.35
      velocity_smoother.ros__parameters.max_velocity: [0.35, 0.3, 1.0]
  C8:
    label: gentler acceleration limits
    changes:
      velocity_smoother.ros__parameters.max_accel: [1.5, 1.5, 2.5]
      velocity_smoother.ros__parameters.max_decel: [-1.5, -1.5, -2.5]
  C9:
    label: earlier approach deceleration (0.9 m)
    changes:
      controller_server.ros__parameters.FollowPath.approach_velocity_scaling_dist: 0.9

  # ---- R5: 走廊来回（scenario_c，2026-10-30 16:57 录包）--------------------
  # 实测：5 m 直走廊里 /plan 自身是蛇形（相对起终点直线最大横偏中位 0.52 m），
  # 走廊宽约 2 m 而全局 inflation_radius 1.04 m ⇒ 中线两侧都有代价，
  # 路径由代价场微差决定 ⇒ 每 3 Hz 重规划都换一条弯法。
  # 曲率闸门因此长期触发，vx 被压在 0.45（=0.9×0.5）。
  B0:
    label: 基线（当前参数 + 当前 BT）
    changes: {}
  S1:
    label: BT 里加 SmoothPath（simple_smoother）
    changes:
      bt_navigator.ros__parameters.default_nav_to_pose_bt_xml: "{HERE}/bt/smooth_navigate_to_pose.xml"
  I1:
    label: 全局膨胀半径 1.04→0.70（走廊中部留出零代价带）
    changes:
      global_costmap.global_costmap.ros__parameters.inflation_layer.inflation_radius: 0.70
  I2:
    label: 全局代价衰减 3.0→6.0（半径不变，中线代价梯度变陡）
    changes:
      global_costmap.global_costmap.ros__parameters.inflation_layer.cost_scaling_factor: 6.0
  K1:
    label: 曲率闸门放宽（min 0.8 / max 1.2 / 保留 0.75）
    changes:
      controller_server.ros__parameters.FollowPath.curvature_min: 0.8
      controller_server.ros__parameters.FollowPath.curvature_max: 1.2
      controller_server.ros__parameters.FollowPath.reduction_ratio_at_high_curvature: 0.75
  R1:
    label: 关掉原地转向（全向底盘边走边转）
    changes:
      controller_server.ros__parameters.FollowPath.use_rotate_to_heading: false

  # ---- R6: 第二轮，针对第一轮结果组合 --------------------------------
  # theta_star 的格代价 = w_traversal_cost * (c/253)^2。当前 10；带内
  # cost 在 20~200 之间，平方后权重对"贴中线"的影响非常陡，值得往上试。
  G30:
    label: 全局 Theta* 代价权重 10→30（更用力贴低代价中线）
    changes:
      planner_server.ros__parameters.GridBased.w_traversal_cost: 30.0
  I1R1:
    label: 全局膨胀 0.70 + 关原地转向
    changes:
      global_costmap.global_costmap.ros__parameters.inflation_layer.inflation_radius: 0.70
      controller_server.ros__parameters.FollowPath.use_rotate_to_heading: false
  I1S1:
    label: 全局膨胀 0.70 + BT 加 SmoothPath
    changes:
      global_costmap.global_costmap.ros__parameters.inflation_layer.inflation_radius: 0.70
      bt_navigator.ros__parameters.default_nav_to_pose_bt_xml: "{HERE}/bt/smooth_navigate_to_pose.xml"

  # ---- R7: 把路径弄直，同时盯住间距 -----------------------------------
  # 第一轮的结论：弯道慢 = 路径扭（1.2 m 内净转 45°）→ 曲率 0.94/m → 闸门
  # 永远触发 → 指令 0.45。要快就得让路径直，而弄直的最大风险是贴障碍。
  # 所以每个变体都要看 clearance，不能只看速度。
  #
  # theta_star 的格代价 = w_traversal_cost * (c/253)^2；它越大越贴低代价
  # 中线、越会为了绕开代价带而弯。降到 0 就是纯最短路，理论上最直、也最
  # 可能贴着墙走 —— 这正是要量出来的东西。
  P1:
    label: 重规划 3 Hz→1 Hz（路径少换几次）
    changes:
      bt_navigator.ros__parameters.default_nav_to_pose_bt_xml: "{HERE}/bt/replan_1hz.xml"
  W2:
    label: Theta* 代价权重 10→2（路径更短更直，可能贴障碍）
    changes:
      planner_server.ros__parameters.GridBased.w_traversal_cost: 2.0
  W0:
    label: Theta* 代价权重 10→0（纯最短路，最直也最贴障碍）
    changes:
      planner_server.ros__parameters.GridBased.w_traversal_cost: 0.0

  # ---- R8: 基础线速度 / 角速度各调高一档 -----------------------------
  # 当前基线 v_linear_max 0.9、max_velocity [0.9, 0.6, 1.3]。实际跑到的是
  # cmd 0.875 -> 0.39 m/s、cmd 1.3 rad/s -> 0.55 rad/s（plant 增益 0.55/0.52
  # 加 0.14 m/s 与 0.25 rad/s 死区）。所以"再快一档"要靠抬指令上限。
  #
  # 注意：plant_measured.json 没有最高速饱和，回放台会一路线性放大；
  # 真车能跑多快这里测不出来，测出来的是"指令要开到多少才能喂饱底盘"。
  # 真车上还必须同步 usb_bridge.launch.py 的 max_vx/max_vy/max_wz，
  # 否则被更紧的一处静默截断（见 docs/parameters.md §4.2）。
  L1:
    label: 线速度 0.9→1.2（加速度同步 2.5→3.0）
    changes:
      controller_server.ros__parameters.FollowPath.v_linear_max: 1.2
      velocity_smoother.ros__parameters.max_velocity: [1.2, 0.6, 1.3]
      velocity_smoother.ros__parameters.min_velocity: [-1.2, -0.6, -1.3]
      velocity_smoother.ros__parameters.max_accel: [3.0, 2.5, 4.0]
      velocity_smoother.ros__parameters.max_decel: [-3.0, -2.5, -4.0]
  L2:
    label: 线速度 0.9→1.5（加速度同步 2.5→3.5）
    changes:
      controller_server.ros__parameters.FollowPath.v_linear_max: 1.5
      velocity_smoother.ros__parameters.max_velocity: [1.5, 0.8, 1.3]
      velocity_smoother.ros__parameters.min_velocity: [-1.5, -0.8, -1.3]
      velocity_smoother.ros__parameters.max_accel: [3.5, 3.0, 4.0]
      velocity_smoother.ros__parameters.max_decel: [-3.5, -3.0, -4.0]
  A1:
    label: 角速度 1.3→1.9（角加速度同步 4.0→5.0）
    changes:
      velocity_smoother.ros__parameters.max_velocity: [0.9, 0.6, 1.9]
      velocity_smoother.ros__parameters.min_velocity: [-0.9, -0.6, -1.9]
      velocity_smoother.ros__parameters.max_accel: [2.5, 2.5, 5.0]
      velocity_smoother.ros__parameters.max_decel: [-2.5, -2.5, -5.0]
  A2:
    label: 角速度 1.3→2.5（角加速度同步 4.0→6.0）
    changes:
      velocity_smoother.ros__parameters.max_velocity: [0.9, 0.6, 2.5]
      velocity_smoother.ros__parameters.min_velocity: [-0.9, -0.6, -2.5]
      velocity_smoother.ros__parameters.max_accel: [2.5, 2.5, 6.0]
      velocity_smoother.ros__parameters.max_decel: [-2.5, -2.5, -6.0]

  # ---- R9: 把 R8 的结果拆干净 ------------------------------------------
  # R8 里 L1/L2 同时抬了 max_velocity 和 max_accel，指令加速度 p95 冲到
  # 4.05/4.62 m/s^2，而底盘斜坡只有 2.5 m/s^2 —— 发得比车做得快，真车上
  # 会跟不动。这两个变体把两件事拆开：只抬高限速，加速度保持底盘能力。
  # U1 单独验证加速度那一半，U2 验证"路径变直 + 限速抬高"能不能叠加。
  U1:
    label: 线速度 0.9→1.2，加速度保持 2.5（不超底盘斜坡）
    changes:
      controller_server.ros__parameters.FollowPath.v_linear_max: 1.2
      velocity_smoother.ros__parameters.max_velocity: [1.2, 0.6, 1.3]
      velocity_smoother.ros__parameters.min_velocity: [-1.2, -0.6, -1.3]
  U2:
    label: 代价权重 10→2 + 线速度 0.9→1.2，加速度保持 2.5
    changes:
      planner_server.ros__parameters.GridBased.w_traversal_cost: 2.0
      controller_server.ros__parameters.FollowPath.v_linear_max: 1.2
      velocity_smoother.ros__parameters.max_velocity: [1.2, 0.6, 1.3]
      velocity_smoother.ros__parameters.min_velocity: [-1.2, -0.6, -1.3]
