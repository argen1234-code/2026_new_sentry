slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: obstacle_scan
    mode: mapping
    resolution: 0.05
    transform_publish_period: 0.02
    map_update_interval: 5.0
    use_map_saver: true
    debug_logging: false
    throttle_scans: 1
    scan_queue_size: 10
    min_laser_range: 0.4
    max_laser_range: 10.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 10.0
