standard_robot_pp_ros2:
  ros__parameters:
    device_name: /dev/ttyACM0
    
    # Protocol selection
    use_sbus_protocol: true   #false  # true=SBUS protocol, false=original protocol
    
    # SBUS protocol will automatically set:
    # baud_rate: 100000
    # parity: even
    # stop_bits: "2"
    
    # Original protocol parameters (used when use_sbus_protocol=false)
    baud_rate: 115200
    flow_control: none
    parity: none
    stop_bits: "1"
    
    # Velocity limits (for SBUS mapping)
    max_linear_velocity: 3.0   # Maximum linear velocity (m/s)
    max_angular_velocity: 3.14 # Maximum angular velocity (rad/s)
    
    set_detector_color: false
    record_rosbag: false
    debug: false

joint_state_publisher:
  ros__parameters:
    use_sim_time: false
    rate: 200
    source_list: ["serial/gimbal_joint_state"]
    offset_timestamp: 0.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: false
    publish_frequency: 200.0
